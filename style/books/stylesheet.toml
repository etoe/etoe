schema_version = 1
description = "Page, body, heading, code and figure tokens for ÆToE books."

[themes]

[themes.Light]

[themes.Light.page]
background = "#FFFFFF"
textcolor = "#202020"
width = "6.0in"
margin = "0.85in"

[themes.Light.body]
fontname = "Libertinus Serif"
fontsize = "10.5pt"
lineheight = "1.28"
textcolor = "#202020"
paragraph_spacing = "0.45em"

[themes.Light.heading]
fontname = "Libertinus Serif"
fontsize = "1.35em"
textcolor = "#183153"
weight = "bold"
spacing_before = "1.2em"
spacing_after = "0.5em"

[themes.Light.code]
fontname = "JetBrains Mono"
fontsize = "8.5pt"
background = "#F3F4F6"
textcolor = "#303846"

[themes.Light.figure]
bordercolor = "#D1D5DB"
background = "#FFFFFF"
padding = "0.4em"

[themes.Light.caption]
textcolor = "#555B66"
fontsize = "9pt"
alignment = "center"


[themes.Dark]

[themes.Dark.page]
background = "#111827"
textcolor = "#E5E7EB"
width = "6.0in"
margin = "0.85in"

[themes.Dark.body]
fontname = "Libertinus Serif"
fontsize = "10.5pt"
lineheight = "1.28"
textcolor = "#E5E7EB"
paragraph_spacing = "0.45em"

[themes.Dark.heading]
fontname = "Libertinus Serif"
fontsize = "1.35em"
textcolor = "#93C5FD"
weight = "bold"
spacing_before = "1.2em"
spacing_after = "0.5em"

[themes.Dark.code]
fontname = "JetBrains Mono"
fontsize = "8.5pt"
background = "#1F2937"
textcolor = "#E5E7EB"

[themes.Dark.figure]
bordercolor = "#4B5563"
background = "#111827"
padding = "0.4em"

[themes.Dark.caption]
textcolor = "#9CA3AF"
fontsize = "9pt"
alignment = "center"



[[rules]]
selector = "node.category-nonmetals"
properties = { background = "$palette.nonmetals.fill", textcolor = "$palette.nonmetals.text", bordercolor = "$palette.nonmetals.border" }

