[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etoe"
version = "0.1.62"
description = "Reference Python implementation of the ÆToE."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aleksei Morozov", email = "aleksei.morozov.19730316.nn.ru@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["etoe", "toe", "ether", "simulation", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "lark>=1.3,<2"
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=6",
]
dev = [
  "etoe[test]",
]

[project.scripts]
etoe = "etoe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etoe = [
  "grammar.lark",
  "data/*.json",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.urls]
Homepage = "https://github.com/etoe/etoe"
